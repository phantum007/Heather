{% extends 'ui/student_base.html' %}

{% block eyebrow %}Account{% endblock %}
{% block page_title %}Change Password{% endblock %}

{% block content %}
<section class="card" style="max-width:480px;">
  <h3 style="margin:0 0 4px;">Change Password</h3>
  <p class="card-subtitle" style="margin:0 0 24px;">Enter your current password then choose a new one.</p>

  <form method="post" class="stack-lg">
    {% csrf_token %}
    <label class="field">
      <span>Current Password</span>
      <input class="input" type="password" name="current_password" required autofocus>
    </label>
    <label class="field">
      <span>New Password</span>
      <input class="input" type="password" name="new_password" minlength="6" required>
    </label>
    <label class="field">
      <span>Confirm New Password</span>
      <input class="input" type="password" name="confirm_password" minlength="6" required>
    </label>
    <button class="button primary" type="submit">Update Password</button>
  </form>
</section>
{% endblock %}
